      <!-- Meta Pixel (Facebook Pixel) — ID configurable depuis l'espace Admin -->
    <script>
/* =============================================================
   Amanouz — Module Meta Pixel (Facebook Pixel)
   - Pixel ID configurable depuis l'espace Admin (aucun ID en dur)
   - Chargé uniquement sur les pages publiques, une seule fois
   - Evénement PageView (initial + navigations SPA)
   - API prête pour d'autres événements (ex: Lead)
   ============================================================= */
(function () {
  "use strict";

  var STORAGE_KEY = "amanouz_site_config";
  var LEGACY_KEY = "amanouz_meta_pixel_id";

  /* ---------- Configuration persistante ---------- */
  function readConfig() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var cfg = raw ? JSON.parse(raw) : {};
      if (!cfg.metaPixelId) {
        var legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy) cfg.metaPixelId = legacy;
      }
      return cfg && typeof cfg === "object" ? cfg : {};
    } catch (e) {
      return {};
    }
  }

  function writeConfig(cfg) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg || {}));
    } catch (e) {
      /* stockage indisponible */
    }
  }

  function sanitizeId(value) {
    return String(value == null ? "" : value).replace(/[^0-9]/g, "").slice(0, 20);
  }

  function isValidId(value) {
    var id = sanitizeId(value);
    return id.length >= 10 && id.length <= 20;
  }

  function getPixelId() {
    var id = sanitizeId(readConfig().metaPixelId);
    return isValidId(id) ? id : "";
  }

  function setPixelId(value) {
    var id = sanitizeId(value);
    if (!isValidId(id)) return { success: false, error: "Pixel ID invalide (10 à 20 chiffres)." };
    var cfg = readConfig();
    cfg.metaPixelId = id;
    writeConfig(cfg);
    applyPixel();
    return { success: true, id: id };
  }

  function clearPixelId() {
    var cfg = readConfig();
    delete cfg.metaPixelId;
    writeConfig(cfg);
    try {
      localStorage.removeItem(LEGACY_KEY);
    } catch (e) {}
    return { success: true };
  }

  /* ---------- Chargement du Pixel ---------- */
  function routePath() {
    // Supporte les URLs classiques (/admin/dashboard) et hash (#/admin/dashboard),
    // ainsi que l'ouverture du fichier en local (file://...index.html#/admin/...).
    var hash = location.hash || "";
    if (/^#\/?/.test(hash)) return "/" + hash.replace(/^#\/?/, "").split("?")[0];
    return location.pathname;
  }

  function isAdminArea() {
    return /(^|\/)admin(\/|$)/.test(routePath()) || !!findDashboardHost();
  }

  function isLoginArea() {
    return /\/admin\/login\/?$/.test(routePath());
  }

  // Repère le conteneur du tableau de bord admin directement dans le DOM :
  // plus fiable que l'URL (SPA, hash, fichier local).
  function findDashboardHost() {
    var headings = document.querySelectorAll("h1");
    for (var i = 0; i < headings.length; i++) {
      var text = (headings[i].textContent || "").trim().toLowerCase();
      if (text.indexOf("tableau de bord") !== -1) {
        var el = headings[i];
        while (el && el !== document.body) {
          if (el.className && String(el.className).indexOf("max-w-7xl") !== -1) return el;
          el = el.parentElement;
        }
        return headings[i].parentElement;
      }
    }
    return null;
  }

  function loadPixelBase() {
    if (window.fbq) return;
    var n = (window.fbq = function () {
      n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
    });
    if (!window._fbq) window._fbq = n;
    n.push = n;
    n.loaded = true;
    n.version = "2.0";
    n.queue = [];
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://connect.facebook.net/en_US/fbevents.js";
    s.setAttribute("data-meta-pixel", "amanouz");
    var first = document.getElementsByTagName("script")[0];
    if (first && first.parentNode) first.parentNode.insertBefore(s, first);
    else document.head.appendChild(s);
  }

  var initializedId = null;
  var lastPageViewPath = null;

  function applyPixel() {
    var id = getPixelId();
    // Aucun ID enregistré -> aucun script Meta Pixel chargé
    if (!id || isAdminArea()) return;
    loadPixelBase();
    if (initializedId !== id) {
      window.fbq("init", id);
      initializedId = id;
      lastPageViewPath = null;
    }
    trackPageView();
  }

  function trackPageView() {
    if (!initializedId) return;
    var path = location.pathname + location.search;
    if (path === lastPageViewPath) return; // évite les doublons sur une même page
    lastPageViewPath = path;
    window.fbq("track", "PageView");
  }

  function track(eventName, params) {
    if (!eventName) return;
    applyPixel();
    if (!initializedId) return;
    window.fbq("track", eventName, params || {});
  }

  /* ---------- Navigations SPA ---------- */
  function hookHistory() {
    ["pushState", "replaceState"].forEach(function (m) {
      var orig = history[m];
      if (!orig || orig.__amanouzPatched) return;
      var patched = function () {
        var r = orig.apply(this, arguments);
        setTimeout(applyPixel, 0);
        return r;
      };
      patched.__amanouzPatched = true;
      history[m] = patched;
    });
    window.addEventListener("popstate", function () {
      setTimeout(applyPixel, 0);
    });
  }

  /* ---------- Panneau Admin ---------- */
  var PANEL_ID = "amanouz-meta-pixel-panel";

  function buildPanel() {
    var wrap = document.createElement("section");
    wrap.id = PANEL_ID;
    wrap.style.cssText =
      "display:block;max-width:960px;margin:40px auto;padding:24px;background:#fff;border:1px solid #E6DFD3;border-radius:12px;font-family:Inter,system-ui,sans-serif;box-shadow:0 6px 24px rgba(27,58,47,.06)";
    wrap.innerHTML = [
      '<h2 style="margin:0 0 4px;font-family:Cinzel,serif;font-size:20px;color:#1B3A2F">Meta Pixel / Facebook Pixel</h2>',
      '<p style="margin:0 0 16px;font-size:13px;color:#6B7A73">Renseignez votre Meta Pixel ID. Il sera automatiquement injecté sur toutes les pages publiques du site (événement PageView). Laissez vide pour désactiver le suivi.</p>',
      '<label for="amanouz-pixel-input" style="display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1B3A2F;margin-bottom:6px">Meta Pixel ID (Facebook Pixel)</label>',
      '<input id="amanouz-pixel-input" inputmode="numeric" autocomplete="off" placeholder="Ex. 1234567890123456" style="width:100%;padding:11px 13px;border:1px solid #D9D1C4;border-radius:8px;font-size:14px;color:#1B3A2F;background:#FAF8F5" />',
      '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">',
      '<button id="amanouz-pixel-save" style="padding:10px 20px;border:0;border-radius:8px;background:#1B3A2F;color:#FAF8F5;font-size:13px;font-weight:600;cursor:pointer">Enregistrer</button>',
      '<button id="amanouz-pixel-delete" style="padding:10px 20px;border:1px solid #C9B79A;border-radius:8px;background:transparent;color:#8A6A3B;font-size:13px;font-weight:600;cursor:pointer">Supprimer</button>',
      "</div>",
      '<p id="amanouz-pixel-status" role="status" style="margin:12px 0 0;font-size:13px;min-height:18px;color:#6B7A73"></p>',
    ].join("");
    return wrap;
  }

  function mountPanel() {
    if (isLoginArea()) return;
    var host = findDashboardHost();
    if (!host) return; // le panneau n'apparaît que dans le tableau de bord admin
    var existing = document.getElementById(PANEL_ID);
    if (existing) {
      if (existing.parentNode === host) return;
      existing.parentNode && existing.parentNode.removeChild(existing);
    }
    var panel = buildPanel();
    host.appendChild(panel);

    var input = panel.querySelector("#amanouz-pixel-input");
    var status = panel.querySelector("#amanouz-pixel-status");
    input.value = getPixelId();

    function say(msg, ok) {
      status.textContent = msg;
      status.style.color = ok ? "#1B3A2F" : "#A4453A";
    }

    panel.querySelector("#amanouz-pixel-save").addEventListener("click", function () {
      var res = setPixelId(input.value);
      if (!res.success) return say(res.error, false);
      input.value = res.id;
      say("Pixel ID enregistré. Le Meta Pixel est actif sur le site public.", true);
    });

    panel.querySelector("#amanouz-pixel-delete").addEventListener("click", function () {
      clearPixelId();
      input.value = "";
      initializedId = null;
      say("Pixel ID supprimé. Aucun script Meta Pixel n'est chargé.", true);
    });
  }

  var mountScheduled = false;
  function scheduleMount() {
    if (mountScheduled) return;
    mountScheduled = true;
    setTimeout(function () {
      mountScheduled = false;
      mountPanel();
    }, 60);
  }

  function watchAdmin() {
    mountPanel();
    var obs = new MutationObserver(function () {
      scheduleMount();
    });
    var root = document.getElementById("root") || document.body;
    if (root) obs.observe(root, { childList: true, subtree: true });
  }

  /* ---------- API publique ---------- */
  window.AmanouzPixel = {
    getPixelId: getPixelId,
    setPixelId: setPixelId,
    clearPixelId: clearPixelId,
    reload: applyPixel,
    track: track,
    // Exemple d'usage futur : AmanouzPixel.trackLead({ content_name: 'Contact' })
    trackLead: function (params) {
      track("Lead", params);
    },
  };

  function boot() {
    hookHistory();
    applyPixel();
    watchAdmin();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

    </script>
  </body>
</html>
